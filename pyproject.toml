[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turret_multimission"
version = "3.0.0"
description = "Modular Autonomous Turret Platform with Dual Missions: Air Defense FCS & Precision Ballistics Cup Basket Challenge - YTU Senior Capstone Project"
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "MIT" }
authors = [
    { name = "Berkay Senturk" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "scipy==1.14.1",
    "matplotlib==3.9.2",
    "torch==2.5.1",
    "ultralytics==8.3.40",
    "lapx==0.5.12; sys_platform == 'win32'",
    "lap==0.5.13; sys_platform != 'win32'",
    "stable-baselines3==2.4.1",
    "gymnasium==1.0.0",
    "tensorboard==2.18.0",
    "pyserial==3.5",
    "pygrabber==0.2; sys_platform == 'win32'",
    "pyyaml==6.0.2",
    "optuna==4.1.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[project.scripts]
turret-fcs = "turret_fcs.main:main"
turret-basket = "turret_basket.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["turret_fcs*", "turret_basket*"]

[tool.setuptools.package-data]
turret_fcs = [
    "rl/models/*.npz",
    "rl/models/*.zip",
]
turret_basket = [
    "rl/models/*.npz",
    "rl/models/*.json",
    "rl/models/*.zip",
]

[tool.pytest.ini_options]
pythonpath = [".", "webots/controllers/webots_turret_fcs"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
